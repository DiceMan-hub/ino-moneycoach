<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-change {
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-change.positive {
            color: #10b981;
        }

        .stat-change.negative {
            color: #ef4444;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .chart-card h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.3rem;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .large-chart {
            grid-column: 1 / -1;
        }

        .large-chart .chart-container {
            height: 400px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 50px;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Instagram Analytics Dashboard</h1>
            <p class="subtitle">パフォーマンス分析レポート</p>
        </header>

        <div class="stats-grid" id="statsGrid">
            <div class="loading">データを読み込み中...</div>
        </div>

        <div class="charts-grid">
            <div class="chart-card large-chart">
                <h2>📈 全指標トレンド</h2>
                <div class="chart-container">
                    <canvas id="overviewChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>👥 プロフィール訪問数</h2>
                <div class="chart-container">
                    <canvas id="visitsChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>➕ フォロワー増加</h2>
                <div class="chart-container">
                    <canvas id="followsChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>💬 インタラクション</h2>
                <div class="chart-container">
                    <canvas id="interactionsChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>👁️ リーチ</h2>
                <div class="chart-container">
                    <canvas id="reachChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>📺 閲覧数</h2>
                <div class="chart-container">
                    <canvas id="viewsChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h2>🔗 リンククリック</h2>
                <div class="chart-container">
                    <canvas id="linkClicksChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data storage
        const datasets = {
            visits: [],
            follows: [],
            interactions: [],
            linkClicks: [],
            reach: [],
            views: []
        };

        // Color scheme
        const colors = {
            visits: { bg: 'rgba(102, 126, 234, 0.2)', border: 'rgba(102, 126, 234, 1)' },
            follows: { bg: 'rgba(16, 185, 129, 0.2)', border: 'rgba(16, 185, 129, 1)' },
            interactions: { bg: 'rgba(245, 158, 11, 0.2)', border: 'rgba(245, 158, 11, 1)' },
            linkClicks: { bg: 'rgba(239, 68, 68, 0.2)', border: 'rgba(239, 68, 68, 1)' },
            reach: { bg: 'rgba(139, 92, 246, 0.2)', border: 'rgba(139, 92, 246, 1)' },
            views: { bg: 'rgba(236, 72, 153, 0.2)', border: 'rgba(236, 72, 153, 1)' }
        };

        // Load and parse CSV files
        async function loadData() {
            const files = [
                { name: 'visits', path: 'Visits.csv' },
                { name: 'follows', path: 'Follows.csv' },
                { name: 'interactions', path: 'Interactions.csv' },
                { name: 'linkClicks', path: 'Link clicks.csv' },
                { name: 'reach', path: 'Reach.csv' },
                { name: 'views', path: 'Views.csv' }
            ];

            for (const file of files) {
                try {
                    const response = await fetch(file.path);
                    const text = await response.text();

                    Papa.parse(text, {
                        encoding: 'UTF-16',
                        skipEmptyLines: true,
                        complete: function(results) {
                            const data = results.data.slice(2); // Skip header rows
                            datasets[file.name] = data
                                .filter(row => row[0] && row[1])
                                .map(row => ({
                                    date: new Date(row[0]),
                                    value: parseInt(row[1]) || 0
                                }))
                                .sort((a, b) => a.date - b.date);
                        }
                    });
                } catch (error) {
                    console.error(`Error loading ${file.path}:`, error);
                }
            }

            // Wait a bit for all parsing to complete
            setTimeout(() => {
                createStats();
                createCharts();
            }, 500);
        }

        // Create statistics cards
        function createStats() {
            const stats = [
                { name: '総プロフィール訪問', key: 'visits', icon: '👥' },
                { name: '総フォロワー増加', key: 'follows', icon: '➕' },
                { name: '総インタラクション', key: 'interactions', icon: '💬' },
                { name: '総リーチ', key: 'reach', icon: '👁️' },
                { name: '総閲覧数', key: 'views', icon: '📺' },
                { name: '総リンククリック', key: 'linkClicks', icon: '🔗' }
            ];

            const statsHTML = stats.map(stat => {
                const data = datasets[stat.key];
                if (!data || data.length === 0) return '';

                const total = data.reduce((sum, item) => sum + item.value, 0);
                const avg = Math.round(total / data.length);
                const recent = data.slice(-7).reduce((sum, item) => sum + item.value, 0) / 7;
                const previous = data.slice(-14, -7).reduce((sum, item) => sum + item.value, 0) / 7;
                const change = ((recent - previous) / previous * 100).toFixed(1);
                const isPositive = change >= 0;

                return `
                    <div class="stat-card">
                        <div class="stat-label">${stat.icon} ${stat.name}</div>
                        <div class="stat-value">${total.toLocaleString()}</div>
                        <div class="stat-change ${isPositive ? 'positive' : 'negative'}">
                            ${isPositive ? '↗' : '↘'} ${Math.abs(change)}% (直近7日間)
                        </div>
                        <div style="margin-top: 10px; color: #999; font-size: 0.85rem;">
                            1日平均: ${avg.toLocaleString()}
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('statsGrid').innerHTML = statsHTML;
        }

        // Create charts
        function createCharts() {
            // Overview chart
            createOverviewChart();

            // Individual charts
            createLineChart('visitsChart', 'visits', 'プロフィール訪問数');
            createLineChart('followsChart', 'follows', 'フォロワー増加');
            createLineChart('interactionsChart', 'interactions', 'インタラクション');
            createLineChart('reachChart', 'reach', 'リーチ');
            createLineChart('viewsChart', 'views', '閲覧数');
            createLineChart('linkClicksChart', 'linkClicks', 'リンククリック');
        }

        // Create overview chart with all metrics
        function createOverviewChart() {
            const ctx = document.getElementById('overviewChart').getContext('2d');

            new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'プロフィール訪問',
                            data: datasets.visits.map(d => ({ x: d.date, y: d.value })),
                            ...colors.visits,
                            borderWidth: 2,
                            tension: 0.4
                        },
                        {
                            label: 'フォロワー増加',
                            data: datasets.follows.map(d => ({ x: d.date, y: d.value })),
                            ...colors.follows,
                            borderWidth: 2,
                            tension: 0.4
                        },
                        {
                            label: 'インタラクション',
                            data: datasets.interactions.map(d => ({ x: d.date, y: d.value })),
                            ...colors.interactions,
                            borderWidth: 2,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: {
                                    day: 'MM/DD'
                                }
                            }
                        },
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // Create individual line chart
        function createLineChart(canvasId, dataKey, label) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            const data = datasets[dataKey];

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.date),
                    datasets: [{
                        label: label,
                        data: data.map(d => d.value),
                        backgroundColor: colors[dataKey].bg,
                        borderColor: colors[dataKey].border,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: {
                                    day: 'MM/DD'
                                }
                            }
                        },
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // Initialize
        loadData();
    </script>
</body>
</html>
